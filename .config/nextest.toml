# Test runner settings for `cargo nextest run`, locally and in CI.
# Each test runs in its own process, and test binaries run in parallel, unlike `cargo test`.

[profile.default]
# A failing test fails: a retry would hide a flaky test instead of explaining it.
retries = 0
# Name a test that runs long, so a stall is seen rather than waited out.
slow-timeout = { period = "60s" }

# Tests that start a real Chrome need a free CPU to open a page within their time limit; two at a time.
# Every profile, ci included, inherits this override.
[test-groups]
browser = { max-threads = 2 }

[[profile.default.overrides]]
filter = 'package(tools) & test(/^browser::tests::/)'
test-group = 'browser'

[profile.ci]
retries = 0
# Every failure on a system is reported in one run, not just the first.
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 10 }
failure-output = "immediate-final"
