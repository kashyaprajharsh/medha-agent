name: Bug report
description: Report a reproducible problem with Medha.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Medha. Share enough detail for someone else to reproduce the problem.

        **This issue will be public.** Remove API keys, OAuth tokens, authorization headers, private endpoints, and personal or confidential data from logs and screenshots. Do not upload your Medha home or credential files.

        For a suspected vulnerability, use the private reporting instructions in the [security policy](https://github.com/kashyaprajharsh/medha-agent/blob/main/SECURITY.md). For setup help, use [Discussions](https://github.com/kashyaprajharsh/medha-agent/discussions).
  - type: input
    id: version
    attributes:
      label: Medha version
      description: Include the installed version, or the commit SHA if you built from source.
      placeholder: "Release version or git rev-parse --short HEAD"
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Where does the problem occur?
      multiple: true
      options:
        - Desktop app
        - Terminal UI (TUI)
        - Headless CLI or plain REPL
        - Editor integration (ACP)
        - Messaging (Telegram)
        - Installation or update
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the OS and version, CPU architecture, and how you installed Medha. Add the terminal or editor version, sandbox backend, and Rust or Node version when relevant.
      placeholder: |
        OS and version:
        Architecture:
        Installation method:
        Terminal or editor, if applicable:
        Sandbox backend, if relevant:
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Provider and model, if relevant
      description: Give the provider name, model ID, and protocol. Omit API keys and private endpoint addresses.
      placeholder: "Provider name / model ID / protocol"
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include the exact error message when available.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the smallest reproducible example, relevant settings, and whether it happens consistently. Use synthetic or public data.
      placeholder: |
        1. Start Medha with...
        2. Configure or open...
        3. Perform this action...
        4. Observe...
    validations:
      required: true
  - type: textarea
    id: regression
    attributes:
      label: Regression or workaround
      description: If known, give the last version that worked, the first version that failed, or a workaround. Leave this blank if unknown.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste a short, redacted excerpt. Include only what is needed to explain the failure.
      render: text
  - type: textarea
    id: context
    attributes:
      label: Screenshots and additional context
      description: Attach redacted screenshots or recordings if helpful, and link related issues or pull requests.
  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed secrets and private data from this report and its attachments.
          required: true
        - label: I agree to follow the [Code of Conduct](https://github.com/kashyaprajharsh/medha-agent/blob/main/CODE_OF_CONDUCT.md).
          required: true
