name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact Git ref or SHA to verify
        required: false
        type: string

permissions:
  contents: read

# Keep only the newest run for each ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Only the runner that installs language servers enables their end-to-end tests.
  MEDHA_LSP_E2E: "0"

jobs:
  minimum-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.89"
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: minimum-rust-1.89
      - name: Check minimum supported Rust
        run: cargo +1.89 check --workspace --all-targets --locked

  # Formatting and linting are platform-independent.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions/checkout, pinned to an immutable upstream commit.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      # Keep rust-toolchain.toml as the single version source.
      - name: Read pinned toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain, pinned from upstream master.
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      # The Linux keyring backend links against D-Bus.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      # Swatinem/rust-cache v2, pinned to the dereferenced tag commit.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Test each published host OS before release packaging.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # Report every platform even if one fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      # Linux installs language servers separately below.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      # Enabling MEDHA_LSP_E2E makes missing provisioned servers fail the run.
      - name: Install language servers
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$HOME/.local/bin"
          # Some images expose only a versioned clangd binary.
          sudo apt-get install -y clangd \
            || sudo apt-get install -y clang-tools
          command -v clangd >/dev/null \
            || ln -sf "$(ls -1 /usr/bin/clangd-* | sort -V | tail -1)" "$HOME/.local/bin/clangd"
          rustup component add rust-analyzer
          ln -sf "$(rustup which rust-analyzer)" "$HOME/.local/bin/rust-analyzer"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "MEDHA_LSP_E2E=1" >> "$GITHUB_ENV"

      - name: Verify servers are on PATH
        if: runner.os == 'Linux'
        run: |
          rust-analyzer --version
          clangd --version

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: ${{ matrix.os }}

      # Every failing test on this system is reported in one run, not just the first.
      # macOS and Linux runners must really enforce the native sandbox, so its tests
      # cannot pass by skipping.
      - name: Test
        env:
          MEDHA_REQUIRE_NATIVE_SANDBOX: ${{ runner.os != 'Windows' && '1' || '' }}
        run: cargo test --workspace --all-targets --no-fail-fast

  # The desktop app has its own dependency graph: a window in TypeScript and a
  # shell in Rust that bundles the `medha` program. Each host OS builds and tests both.
  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        working-directory: .
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      # actions/setup-node v4.4.0, pinned to its commit.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # The webview and tray libraries the shell links against, and D-Bus for the keyring.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev patchelf pkg-config

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: desktop-${{ matrix.os }}
          workspaces: |
            .
            apps/desktop/src-tauri

      - name: Install window dependencies
        run: npm ci

      # The shell embeds the built window and checks the bundled program exists,
      # so both come before anything in Rust is compiled.
      - name: Build the window
        run: npm run build

      - name: Test the window
        run: npm test

      - name: Build the bundled program
        run: npm run prepare:backend

      - name: Format
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test the shell
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked --no-fail-fast
