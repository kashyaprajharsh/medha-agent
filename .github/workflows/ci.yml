name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml is the single source of truth, but the action needs
      # the version as an input — so read it out rather than duplicating it.
      - name: Read pinned toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy, rust-analyzer

      # Real language servers so the LSP end-to-end tests exercise the protocol
      # path instead of silently skipping when a binary is absent.
      - name: Install build and language-server dependencies
        run: |
          mkdir -p "$HOME/.local/bin"
          sudo apt-get update
          # keyring's Linux backend (sync-secret-service) links against D-Bus,
          # so libdbus-sys needs the headers and pkg-config to find them.
          sudo apt-get install -y libdbus-1-dev pkg-config
          # `clangd`, not `clang-tools`: the latter installs only versioned
          # binaries (clangd-14, …) and no unversioned symlink, so a bare
          # `clangd` is not on PATH. Fall back to symlinking whichever
          # versioned one apt provides if the meta-package is unavailable.
          sudo apt-get install -y clangd \
            || sudo apt-get install -y clang-tools
          command -v clangd >/dev/null \
            || ln -sf "$(ls -1 /usr/bin/clangd-* | sort -V | tail -1)" "$HOME/.local/bin/clangd"
          # rust-analyzer ships as a rustup component; expose it on PATH.
          ln -sf "$(rustup which rust-analyzer)" "$HOME/.local/bin/rust-analyzer"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify servers are on PATH
        run: |
          rust-analyzer --version
          clangd --version

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
