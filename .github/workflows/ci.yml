name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact Git ref or SHA to verify
        required: false
        type: string

permissions:
  contents: read

# Keep only the newest run for each ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Only the runner that installs language servers enables their end-to-end tests.
  MEDHA_LSP_E2E: "0"

jobs:
  minimum-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.88"
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: minimum-rust-1.88
      - name: Check minimum supported Rust
        run: cargo +1.88 check --workspace --all-targets --locked

  # Formatting and linting are platform-independent.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions/checkout, pinned to an immutable upstream commit.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      # Keep rust-toolchain.toml as the single version source.
      - name: Read pinned toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain, pinned from upstream master.
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      # The Linux keyring backend links against D-Bus.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      # Swatinem/rust-cache v2, pinned to the dereferenced tag commit.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Test each published host OS before release packaging.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # Report every platform even if one fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      # Linux installs language servers separately below.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      # Enabling MEDHA_LSP_E2E makes missing provisioned servers fail the run.
      - name: Install language servers
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$HOME/.local/bin"
          # Some images expose only a versioned clangd binary.
          sudo apt-get install -y clangd \
            || sudo apt-get install -y clang-tools
          command -v clangd >/dev/null \
            || ln -sf "$(ls -1 /usr/bin/clangd-* | sort -V | tail -1)" "$HOME/.local/bin/clangd"
          rustup component add rust-analyzer
          ln -sf "$(rustup which rust-analyzer)" "$HOME/.local/bin/rust-analyzer"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "MEDHA_LSP_E2E=1" >> "$GITHUB_ENV"

      - name: Verify servers are on PATH
        if: runner.os == 'Linux'
        run: |
          rust-analyzer --version
          clangd --version

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: ${{ matrix.os }}

      - name: Test
        run: cargo test --workspace --all-targets
