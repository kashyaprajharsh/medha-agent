name: Mirror release

# Mirrors an already published release to R2, for a release made before the mirror existed or
# to finish a mirror that stopped part way. Rerunning is safe: identical files are kept.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag, such as v0.1.12"
        required: true
        type: string

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Download the published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist

      - name: Mirror to R2
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: medha-download
        run: sh .github/scripts/mirror_r2.sh dist "$TAG"
