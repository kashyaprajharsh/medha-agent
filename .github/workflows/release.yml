name: Release

# Cuts a release from a tag. Publishing the archives is what makes the
# curl|sh installers work — `install.sh` and `install.ps1` resolve the
# latest tag from this repo's releases and download the matching asset.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref or SHA to validate; publishing requires an existing v* tag"
        required: true
        type: string
      publish:
        description: "Publish the validated existing tag"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
  RELEASE_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}

jobs:
  # Resolve one immutable release identity before any compilation. A manual
  # dispatch may dry-run any ref/SHA, but publishing additionally requires an
  # existing version-matching tag that resolves to the exact checked-out SHA.
  validate:
    name: validate release identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.release_ref.outputs.sha }}
      tag: ${{ steps.release_ref.outputs.tag }}
    steps:
      # actions/checkout v5.1.0, pinned to an immutable upstream commit.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Match tag, commit, and package version
        id: release_ref
        shell: bash
        run: |
          version="$(sed -n 's/^version *= *"\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          sha="$(git rev-parse HEAD)"
          tag="v$version"

          if [ "$RELEASE_PUBLISH" = "true" ]; then
            requested="$RELEASE_REF"
            case "$requested" in
              refs/tags/*) tag="${requested#refs/tags/}" ;;
              *) tag="$requested" ;;
            esac
            if ! printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
              echo "publishing requires an existing semantic-version tag, got: $tag" >&2
              exit 1
            fi
            if [ "$tag" != "v$version" ]; then
              echo "tag $tag does not match workspace version $version" >&2
              exit 1
            fi
            tag_sha="$(git rev-parse "refs/tags/$tag^{commit}" 2>/dev/null)" \
              || { echo "release tag does not exist: $tag" >&2; exit 1; }
            if [ "$sha" != "$tag_sha" ]; then
              echo "$tag points at $tag_sha, not checked-out SHA $sha" >&2
              exit 1
            fi
          fi

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Run the same lint and Linux/macOS/Windows test matrix as ordinary CI, but
  # against the exact validated tag commit. Build cannot start unless every
  # called-workflow job succeeds.
  verify:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ needs.validate.outputs.sha }}

  build:
    name: ${{ matrix.target }}
    needs: [validate, verify]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest supported glibc so the binary keeps working on
          # distros older than the runner.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      # Version comes from rust-toolchain.toml, so a published binary is built
      # by the same compiler CI linted with — not whatever stable happens to be.
      - id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      # Third-party actions are commit-pinned because this workflow produces
      # release binaries and its final job has repository write permission.
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: ${{ matrix.target }}

      # keyring's Linux backend talks to the Secret Service over D-Bus.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p medha-cli

      # The reusable verify job has already tested this exact SHA on Linux,
      # macOS and Windows, including both installer suites.
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          staging="medha-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/medha" medha
          tar czf "$staging.tar.gz" medha
          shasum -a 256 "$staging.tar.gz" > "$staging.tar.gz.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          staging="medha-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/medha.exe" medha.exe
          7z a "$staging.zip" medha.exe
          certutil -hashfile "$staging.zip" SHA256 | sed -n 2p > "$staging.zip.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: medha-${{ matrix.target }}
          path: |
            medha-${{ matrix.target }}.tar.gz*
            medha-${{ matrix.target }}.zip*
          if-no-files-found: error

  release:
    needs: [validate, build]
    if: ${{ github.event_name == 'push' || inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          merge-multiple: true
          path: dist

      - name: Publish
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          draft: false
          generate_release_notes: true
          files: dist/*
