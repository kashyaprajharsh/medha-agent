name: Dependency security

on:
  push:
    branches: [main, master]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "apps/desktop/package.json"
      - "apps/desktop/package-lock.json"
      - deny.toml
      - ".github/workflows/**"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "apps/desktop/package.json"
      - "apps/desktop/package-lock.json"
      - deny.toml
      - ".github/workflows/**"
  schedule:
    # Refresh RustSec even when the dependency graph has not changed.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # actions/checkout v5.1.0, pinned by commit rather than a mutable tag.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Reject mutable GitHub Action references
        shell: bash
        run: |
          action_refs="$(grep -RInE '^[[:space:]]*(- )?uses:[[:space:]]+[^[:space:]]+@[^[:space:]#]+' .github/workflows || true)"
          mutable="$(printf '%s\n' "$action_refs" | grep -Ev '@[0-9a-f]{40}([[:space:]]*#.*)?$' || true)"
          if [ -n "$mutable" ]; then
            printf 'GitHub Actions must use immutable 40-hex commit SHAs:\n%s\n' "$mutable" >&2
            exit 1
          fi

      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: RustSec advisories and yanked crates
        run: cargo deny --all-features check advisories

      - name: Licenses, dependency bans, and sources
        run: cargo deny --all-features check licenses bans sources

      # The desktop shell resolves its own lockfile, so the same policy is run on it.
      - name: Desktop shell advisories and yanked crates
        run: >-
          cargo deny --manifest-path apps/desktop/src-tauri/Cargo.toml --config deny.toml
          --all-features check advisories

      - name: Desktop shell licenses, dependency bans, and sources
        run: >-
          cargo deny --manifest-path apps/desktop/src-tauri/Cargo.toml --config deny.toml
          --all-features check licenses bans sources

  # What ships inside the desktop window: the packages it runs, not the tools that build it.
  desktop-window:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Known vulnerabilities in shipped packages
        working-directory: apps/desktop
        run: npm audit --omit=dev --audit-level=moderate
