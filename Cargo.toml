[workspace]
resolver = "2"
members = [
    "crates/kernel",
    "crates/providers",
    "crates/medha-cli", "crates/context", "crates/lsp", "crates/mcp", "crates/sandbox", "crates/tools", "crates/store", "crates/policy", "crates/lockfile", "crates/permissions", "crates/gate", "crates/memory", "crates/orchestrator",
]

[workspace.package]
edition = "2024"
version = "0.1.8"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
async-trait = "0.1"
# rustls avoids a system OpenSSL dependency in portable builds.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "charset", "http2", "rustls-tls"] }
ulid = "1"
thiserror = "2"
anyhow = "1"

# Local crates
kernel = { version = "0.1.8", path = "crates/kernel" }
providers = { version = "0.1.8", path = "crates/providers" }
context = { version = "0.1.8", path = "crates/context" }
