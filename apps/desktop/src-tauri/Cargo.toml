[package]
name = "medha-desktop"
version = "0.1.10"
description = "Medha desktop shell"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false
build = "build.rs"

# The desktop shell has its own dependency graph and lockfile. Core runtime
# crates remain in the repository's existing workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rfd = "0.17"
portable-pty = "0.9"
base64 = "0.22"
getrandom = "0.3"
media = { path = "../../../crates/media" }
transcript-view = { path = "../../../crates/transcript-view" }
tauri-plugin-updater = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
