[package]
name = "medha-desktop"
version = "0.1.11"
description = "Medha desktop shell"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false
build = "build.rs"

# The desktop shell has its own dependency graph and lockfile. Core runtime
# crates remain in the repository's existing workspace.
[workspace]

# This standalone workspace does not inherit the root workspace's profiles.
[profile.dev.package.sha2]
opt-level = 3

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
file-ops = { path = "../../../crates/file-ops" }
git-safety = { path = "../../../crates/git-safety" }
sha2 = "0.10"
tauri = { version = "2", features = ["macos-private-api"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rfd = "0.17"
portable-pty = "0.9"
base64 = "0.22"
getrandom = "0.3"
dirs = "6"
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "sync", "net"] }
media = { path = "../../../crates/media" }
wire = { path = "../../../crates/wire" }
medha-client = { path = "../../../crates/medha-client" }
protocol = { package = "medha-protocol", path = "../../../crates/protocol" }
transcript-view = { path = "../../../crates/transcript-view" }
# Releases ship raw NSIS/AppImage installers and macOS tarballs, never ZIP updates.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
test-support = { path = "../../../crates/test-support" }
medha-client = { path = "../../../crates/medha-client", features = ["test-support"] }
