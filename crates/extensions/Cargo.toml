[lints]
workspace = true

[package]
name = "extensions"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
file-ops = { path = "../file-ops" }
git-safety = { path = "../git-safety" }
medha-extension-api = { path = "../extension-api" }
kernel = { path = "../kernel" }
sandbox = { path = "../sandbox" }
async-trait.workspace = true
fd-lock = "4"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["process", "rt", "time"] }
tokio-util = "0.7"
toml = "0.8"
ulid.workspace = true
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# zip leaves the inflate backend to its user; this is the pure-Rust one already in the build.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
