[package]
name = "kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
ulid = { workspace = true, features = ["serde"] }
thiserror.workspace = true
async-trait.workspace = true
futures.workspace = true
# The kernel commits to tokio (like every other crate here): the tool/sandbox
# futures it awaits already require a tokio runtime, so runtime-agnosticism
# bought nothing — and interrupts.rs needs select!/sync/time first-class.
tokio = { workspace = true, features = ["sync", "time", "macros"] }
tokio-util = "0.7"
sha2 = "0.10"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
