[package]
name = "medha-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "medha"
path = "src/main.rs"

[dependencies]
kernel.workspace = true
providers.workspace = true
context.workspace = true
tools = { path = "../tools" }
memory = { path = "../memory" }
sandbox = { path = "../sandbox" }
store = { path = "../store" }
ulid.workspace = true
policy = { path = "../policy" }
lockfile = { path = "../lockfile" }
lsp = { path = "../lsp" }
gate = { path = "../gate" }
tokio = { workspace = true, features = ["process", "io-std", "io-util"] }
tokio-util = { version = "0.7" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
futures.workspace = true
async-trait.workspace = true
clap = { version = "4", features = ["derive"] }
toml = "0.8"
dirs = "5"
rustyline = "14"
# Keep crossterm pinned to the same version ratatui re-exports (PART 7) — a mismatch
# means two crossterm versions in the tree and event types that don't unify.
ratatui = "0.30"
# Markdown: rustdoc/mdBook-grade pull parser (industry standard, MIT). We own the
# ratatui rendering so tables, code fences, and colors match the medha theme and
# adapt to light/dark — no off-the-shelf renderer fits that + our virtualized scroll.
pulldown-cmark = { version = "0.13", default-features = false }
# Code-fence syntax highlighting (same crate bat/delta/mdcat use). `default-fancy`
# keeps it pure-Rust (fancy-regex, no Oniguruma C dependency).
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
similar = "2"
crossterm = { version = "0.29", features = ["event-stream"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Terminal cells, not chars: CJK/emoji are 2 columns (K14). Same crate ratatui uses.
unicode-width = "0.2"
# OSC 52 terminal clipboard transport for transcript selection.
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
# TUI stdout-corruption fix: dup/dup2 the real tty so the terminal draws on a
# private handle while a dependency's stray println! is redirected to a log.
libc = "0.2"
