[package]
name = "orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kernel = { path = "../kernel" }
async-trait.workspace = true
futures.workspace = true
fd-lock = "4"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
ulid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
# Liveness test for a worktree's owning process, so a second Medha in the same
# repository cannot remove a checkout that is still being written to.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  # Only for the SYNCHRONIZE access right, which windows-sys files here.
  "Win32_Storage_FileSystem",
] }
