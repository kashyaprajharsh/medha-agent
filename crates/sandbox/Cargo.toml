[package]
name = "sandbox"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
tokio-util = "0.7"
thiserror.workspace = true
ulid.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "sync", "time", "rt"] }
permissions = { path = "../permissions" }
kernel = { path = "../kernel" }
sha2 = "0.10"

# Linux OS-native sandbox: Landlock LSM (kernel ≥5.13), no external binary.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

# Unix: SIGKILL a command's whole process group on timeout/cancel (no orphans).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "time"] }
