[lints]
workspace = true

[package]
name = "tools"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
file-ops = { path = "../file-ops" }
git-safety = { path = "../git-safety" }
kernel.workspace = true
media.workspace = true
lsp = { path = "../lsp" }
mcp = { path = "../mcp" }
orchestrator = { path = "../orchestrator" }
sandbox = { path = "../sandbox" }
policy = { path = "../policy" }
shell-reader = { path = "../shell-reader" }
memory = { path = "../memory" }
store = { path = "../store" }
ulid = "1"
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
thiserror.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["process"] }
# Skills: parse/emit SKILL.md frontmatter. YAML is the ecosystem standard;
# TOML stays as a read-only legacy fallback. A safe-Rust parser (serde_yaml is
# deprecated and its libyaml translation unmaintained).
serde-saphyr = "2"
toml = "0.8"
similar = "2"
regex = "1"
ignore = "0.4"
glob = "0.3"
reqwest = { workspace = true }
scraper = "0.20"
htmd = "0.5"
urlencoding = "2"
pulldown-cmark = { version = "0.13", default-features = false }
pdf-extract = "0.12"
quick-xml = "0.41"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
sha2 = "0.10"
fd-lock = "4"

[dev-dependencies]
test-support = { path = "../test-support" }
tokio-util = { version = "0.7" }
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
lockfile = { path = "../lockfile" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Storage_FileSystem",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
